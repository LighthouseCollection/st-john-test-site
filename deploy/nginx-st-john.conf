# St. John the Beloved test site on the Plenix server (VM 130): /etc/nginx/sites-available/st-john, enabled in
# sites-enabled. Nginx Proxy Manager (CT 102) ends HTTPS for stjohn.lighthouseway.org, signs people in through Authentik
# and passes the request here; this hands it to the app container (127.0.0.1:8790).
server {
    listen 80;
    server_name stjohn.lighthouseway.org;
    absolute_redirect off;
    client_max_body_size 1m;
    # /version.json (owner, version-json-33): written by deploy/deploy.sh at each deploy; what is live, without the app
    location = /version.json {
        alias /srv/st-john/version.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
